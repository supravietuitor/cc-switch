name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（用于产物命名与 tag，例如 3.18.0）"
        required: true
        default: "0.0.0-ci"
      publish:
        description: "是否构建并发布（true=构建+发布；false=仅构建不发 Release）"
        required: false
        default: "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-2022
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "⚠ TAURI_SIGNING_PRIVATE_KEY not set — updater signing disabled"
            echo "TAURI_SIGNING_PRIVATE_KEY=" >> "$GITHUB_ENV"
            exit 0
          fi
          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
          elif DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s' "$DECODED" > "$KEY_PATH"
          elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            printf 'untrusted comment: tauri signing key\n%s\n' "$(printf '%s' "$RAW" | tr -d '\r\n')" > "$KEY_PATH"
          else
            echo "⚠ TAURI_SIGNING_PRIVATE_KEY format not recognized — disabling signing"
            echo "TAURI_SIGNING_PRIVATE_KEY=" >> "$GITHUB_ENV"
            exit 0
          fi
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri App (Windows x64)
        shell: pwsh
        run: pnpm tauri build

      - name: List generated bundles (debug)
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== bundles under src-tauri/target ==="
          Get-ChildItem -Path src-tauri/target -Recurse -Include *.msi,*.exe,*.nsis,*.sig,*.zip -ErrorAction SilentlyContinue |
            Select-Object FullName,Length

      - name: Prepare Windows x64 Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "v${{ steps.ver.outputs.version }}"
          $targetRoot = 'src-tauri/target/release'

          # MSI installer (+ .sig if present, used by updater)
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($msi) {
            $dest = "CC-Switch-$VERSION-Windows.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets "$dest.sig")
              Write-Host "Signature copied: $dest.sig"
            } else {
              Write-Warning "No .sig for MSI — updater won't be able to verify this build"
            }
          } else {
            Write-Warning 'No MSI installer found'; exit 1
          }

          # NSIS installer (optional, newer tauri also emits it)
          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dest = "CC-Switch-$VERSION-Windows-Setup.exe"
            Copy-Item $nsis.FullName (Join-Path release-assets $dest)
            Write-Host "NSIS setup copied: $dest"
            $sigPath = "$($nsis.FullName).sig"
            if (Test-Path $sigPath) { Copy-Item $sigPath (Join-Path release-assets "$dest.sig") }
          }

          # Portable zip (exe only, NOT part of updater)
          $exePath = 'src-tauri/target/release/cc-switch.exe'
          if (Test-Path $exePath) {
            $portableDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            @('# CC Switch portable build marker','portable=true') |
              Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
            Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/CC-Switch-$VERSION-Windows-Portable.zip" -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Portable zip created"
          } else {
            Write-Warning 'Portable exe not found'
          }

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-Windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    needs: release
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-Windows-x64
          path: release-assets

      - name: List downloaded release artifacts
        shell: bash
        run: ls -la release-assets

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: CC Switch ${{ steps.rel.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY" --clobber
          ls -la dl

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"
          win_x64_url=""; win_x64_sig=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            base="${sig%.sig}"
            fname=$(basename "$base")
            sig_content=$(cat "$sig")
            case "$fname" in
              *-Windows-arm64.msi) ;;           # ignore arm64 (none built)
              *-Windows.msi) win_x64_url="$base_url/$fname"; win_x64_sig="$sig_content";;
            esac
          done
          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"notes\": \"CC Switch $TAG\","
            echo "  \"pub_date\": \"$PUB_DATE\","
            echo '  "platforms": {'
            if [ -n "$win_x64_url" ] && [ -n "$win_x64_sig" ]; then
              echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
            fi
            echo '  }'
            echo '}'
          } > latest.json
          echo "=== latest.json ==="; cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}"
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"